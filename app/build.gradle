plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mi.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.mi.launcher"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
